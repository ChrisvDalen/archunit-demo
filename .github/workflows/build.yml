name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archunit-demo

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: archunit-demo/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
