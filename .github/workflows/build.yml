name: Build

on:
  push:
    branches: [ master, "agent/**", "claude/**" ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archunit-demo

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: archunit-demo/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode verify
